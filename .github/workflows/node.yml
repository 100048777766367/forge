name: Forge Compute Foundry Lifecycle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '10 */4 * * *'

permissions:
  contents: write

jobs:
  run-forge:
    runs-on: ubuntu-latest
    steps:
      # 1. KÉO CODE BẰNG LINUX SHELL GỐC (THOÁT LY RUNNER NODE.JS HOÀN TOÀN)
      - name: Kéo mã nguồn Forge
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      # 2. HẠ TẦNG CI/CD MỚI NHẤT: SETUP-PYTHON V7 & PYTHON 3.14
      - name: Thiết lập môi trường Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # 3. VẬN HÀNH ĐỘNG CƠ LÒ ĐÚC KERNEL.PY
      - name: Vận hành Lò Đúc Tính Toán
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python kernel.py

      # 4. LƯU THÀNH PHẨM VÀO GIT BỌC THÉP (FAST-FORWARD, CHỐNG LỖI 128)
      - name: Lưu vết tích năng lượng tính toán vào Git
        run: |
          git config --global user.name "Forge-Foundry-Bot"
          git config --global user.email "bot@forge.foundry"
          
          # Cấp token an toàn cho chính repo này
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          [ "$TARGET_BRANCH" = "HEAD" ] || [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="main"

          git fetch origin "$TARGET_BRANCH"
          git reset origin/"$TARGET_BRANCH"
          
          # Stage an toàn tất cả các phân xưởng
          for d in crucible furnace settlement organs synapses; do
            [ -d "$d" ] && git add -A "$d"
          done
          git add contract.json synapse_forward.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "⚡ [Forge Foundry] Rèn đúc năng lượng tính toán & Proof-of-Compute #(1+N) [skip ci]"
            git push origin "$TARGET_BRANCH"
          else
            echo "Lò đúc tĩnh lặng, không có biến thiên mới."
          fi
